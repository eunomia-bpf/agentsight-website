name: Publish static site

on:
  workflow_run:
    workflows: [Website CI]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-static-site
  cancel-in-progress: true

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Publish generated files to site branch
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          tar -C out -cf "$RUNNER_TEMP/site.tar" .
          git checkout --orphan site-publish
          git rm -rf .
          tar -xf "$RUNNER_TEMP/site.tar"
          touch .nojekyll
          git add -A
          git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "Publish ${SOURCE_SHA}"
          git push --force origin HEAD:site
