name: Publish static site

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: publish-static-site
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          submodules: recursive
      - name: Validate publication source
        run: |
          git cat-file -e "${SOURCE_SHA}^{commit}"
          git fetch origin main --quiet
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Check out publication branch
        uses: actions/checkout@v7
        with:
          ref: site
          fetch-depth: 1
          path: .publish-site
      - name: Publish generated files to site branch
        run: |
          publish_dir="$GITHUB_WORKSPACE/.publish-site"
          tar -C out -cf "$RUNNER_TEMP/site.tar" .
          find "$publish_dir" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -C "$publish_dir" -xf "$RUNNER_TEMP/site.tar"
          touch "$publish_dir/.nojekyll"
          printf '%s\n' "$SOURCE_SHA" > "$publish_dir/.source-sha"
          git -C "$publish_dir" add -A
          if git -C "$publish_dir" ls-files | grep -Eq '^(\.next|node_modules|out)(/|$)'; then
            echo "Refusing to publish build caches or dependencies" >&2
            exit 1
          fi
          test -f "$publish_dir/index.html"
          if git -C "$publish_dir" diff --cached --quiet -- . ':(exclude).source-sha'; then
            echo "Rendered output is unchanged; keeping the existing publication source marker"
            git -C "$publish_dir" reset --hard HEAD
            exit 0
          fi
          git -C "$publish_dir" -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "Publish ${SOURCE_SHA}"
          git -C "$publish_dir" push origin HEAD:site
