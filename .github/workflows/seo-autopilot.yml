name: Autonomous SEO operations

on:
  schedule:
    - cron: '37 16 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: Public reason for this operating cycle
        required: false
        default: manual
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/seo-autopilot.yml'
      - '.github/seo-data/site.md'

permissions:
  actions: write
  checks: read
  contents: write
  deployments: read
  issues: write
  pull-requests: write

concurrency:
  group: agentsight-seo-autopilot
  cancel-in-progress: false

jobs:
  operate:
    if: github.repository == 'eunomia-bpf/agentsight-website'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      TZ: America/Los_Angeles
      SEO_AUTOMATION_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      SEO_AUTOMATION_REASON: ${{ inputs.reason || github.event_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Preflight
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::error title=Missing OPENAI_API_KEY::Add the repository or organization Actions secret OPENAI_API_KEY to start autonomous SEO operations."
            exit 1
          fi
          command -v gh
          command -v jq
          git submodule status --recursive
          python3 .github/seo-skills/scripts/validate_seo_data.py --data-root .github/seo-data
          npm ci
      - name: Configure delivery identity
        run: |
          git config user.name "agentsight-seo[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Run the autonomous SEO operating cycle
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/seo-skills/templates/daily-automation-prompt.md
          output-file: ${{ runner.temp }}/seo-agent-final-message.md
          working-directory: .
          sandbox: danger-full-access
          safety-strategy: drop-sudo
          allow-bots: true
          effort: high
      - name: Verify the cycle closed cleanly
        run: |
          git fetch origin main --quiet
          git checkout --detach origin/main
          git submodule update --init --recursive
          today="$(date +%F)"
          report=".github/seo-data/daily/${today}.md"
          python3 .github/seo-skills/scripts/validate_seo_data.py --data-root .github/seo-data --date "$today"
          grep -F -- '- Status: completed' "$report"
          grep -Eq '^- Change pull request: `https://github.com/eunomia-bpf/agentsight-website/pull/[0-9]+`$' "$report"
          grep -Eq '^- Closeout pull request: `https://github.com/eunomia-bpf/agentsight-website/pull/[0-9]+`$' "$report"
          test -z "$(git status --porcelain)"
          open_count="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --json headRefName --jq '[.[] | select(.headRefName | startswith("seo/agentsight-"))] | length')"
          test "$open_count" -eq 0
