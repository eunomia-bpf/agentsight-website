name: Website CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Enforce autonomous SEO scope
        env:
          SEO_AUTOMATION_BRANCH: ${{ github.head_ref || github.ref_name }}
          SEO_BASE_REF: origin/main
        run: |
          case "$SEO_AUTOMATION_BRANCH" in
            seo/agentsight-*)
              git fetch origin main --quiet
              git show origin/main:scripts/check-seo-automation-scope.py > "$RUNNER_TEMP/check-seo-automation-scope.py"
              python3 "$RUNNER_TEMP/check-seo-automation-scope.py"
              ;;
            *)
              echo "SEO scope guard not required for $SEO_AUTOMATION_BRANCH"
              ;;
          esac
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify
      - uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: out
          if-no-files-found: error
          retention-days: 7
