name: Website bug
description: Report a broken route, layout, link, or browser behavior.
title: "bug: "
labels: [bug]
body:
  - type: input
    id: page
    attributes:
      label: Page URL
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What happened?
      description: Include browser, device, screenshots, and reproduction steps when relevant.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
